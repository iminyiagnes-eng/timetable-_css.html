<!DOCTYPE html>
<html>

<head>
    <title>Tables</title>

    <style>

        body {
            margin: 10px;
        }

        table {
            width: 60%;
            border-collapse: collapse;
        }

        caption {
            color: blue;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        th, td {
            border: 1px solid black;
            padding: 1px;
            text-align: center;
            font-size: 10px;
        }

        th {
            background-color: green;
        }

        td {
            background-color: pink;
        }

    </style>
</head>

<body>

    <table>

        <caption>Timetable</caption>

        <tr>
            <th scope="col">Day/Time</th>
            <th>9am</th>
            <th>10am</th>
            <th>11am</th>
            <th>12pm</th>
        </tr>

        <tr>
            <th scope="row">Monday</th>
            <td colspan="2">CIS 210</td>
            <td>CIS 211</td>
            <td>CIS 212</td>
        </tr>

        <tr>
            <th scope="row">Tuesday</th>
            <td>CIS 122</td>
            <td>CIS 133</td>
            <td colspan="2">CIS 213</td>
        </tr>

    </table>

</body>

</html>
